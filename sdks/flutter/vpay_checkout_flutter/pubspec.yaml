name: vpay_checkout_flutter
description: >-
  A payer-facing checkout surface for vpay: opens the hosted checkout page
  in a native window and reports a typed result once a payment intent
  actually settles. Not a way to unlock in-app content — see the README's
  App Store / Play Store section before using externalBrowser mode.
version: 0.1.0
homepage: https://github.com/vaam-apps/vpay
repository: https://github.com/vaam-apps/vpay
publish_to: none # not published yet (2026-09-13) — see docs/sdks/parity.md

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^29.0.0

# No `flutter: plugin:` section yet, deliberately: that block registers
# per-platform implementations (android/ios/macos/web) with the tooling, and
# this branch has none — Lane C
# (docs/plans/2026-09-13-flutter-plugin-brief.md) creates
# `android/`, `ios/`, `macos/` and the web implementation, and adds the
# `flutter: plugin: platforms:` block naming them at that point. Adding it
# now, pointing at directories and classes that do not exist, would make
# `flutter pub get`/`flutter analyze` reason about a federated plugin with
# nothing behind it.
flutter: {}
